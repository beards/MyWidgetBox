<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script data-theme-boot>
      // Sets the theme before first paint; shared/theme.ts owns the list and the storage key.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('mywidgetbox:theme');
        } catch (error) {}
        document.documentElement.dataset.theme = ['soft', 'dark', 'paper'].indexOf(theme) >= 0 ? theme : 'soft';
      })();
    </script>
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      /* The catalog page is all theme: page color, cards and switchers come from shared/theme.css. */
      body.catalog {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 3rem 1.25rem;
        background: var(--theme-bg);
        color: var(--theme-text);
        font-family: var(--theme-font);
      }

      .catalog__inner {
        max-width: 52rem;
        margin: 0 auto;
      }

      .catalog__header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2.5rem;
      }

      .catalog__title {
        margin: 0;
        font-family: var(--theme-heading-font);
        font-size: 2rem;
        letter-spacing: -0.01em;
      }

      .catalog__tagline {
        margin: 0.5rem 0 0;
        color: var(--theme-muted);
      }

      .catalog__switchers {
        display: flex;
        gap: 0.5rem;
      }

      .catalog__tiles {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      @media (min-width: 40rem) {
        .catalog__tiles {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .catalog__tile {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        height: 100%;
        box-sizing: border-box;
        padding: 1.5rem 1.25rem;
        border: 1px solid var(--theme-border);
        border-radius: calc(var(--theme-radius) * 1.75);
        background: var(--theme-surface);
        box-shadow: var(--theme-shadow);
        color: inherit;
        text-decoration: none;
        transition:
          translate 0.15s,
          box-shadow 0.15s,
          border-color 0.15s;
      }

      .catalog__tile:hover,
      .catalog__tile:focus-visible {
        translate: 0 -2px;
        border-color: var(--theme-accent);
        box-shadow: var(--theme-shadow-hover);
      }

      .catalog__icon {
        width: 2.5rem;
        height: 2.5rem;
        margin-bottom: 0.75rem;
        color: var(--theme-accent);
      }

      .catalog__name {
        font-family: var(--theme-heading-font);
        font-size: 1.25rem;
        font-weight: 700;
      }

      .catalog__desc {
        color: var(--theme-muted);
        font-size: 0.9rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .catalog__tile {
          transition: none;
        }

        .catalog__tile:hover,
        .catalog__tile:focus-visible {
          translate: none;
        }
      }

      /* Touch screens: finger-sized switchers. */
      @media (pointer: coarse) {
        .catalog select {
          min-height: 2.75rem;
        }
      }
    </style>
  </head>
  <body class="catalog">
    <div class="catalog__inner">
      <header class="catalog__header">
        <div>
          <h1 class="catalog__title" data-i18n="title"></h1>
          <p class="catalog__tagline" data-i18n="tagline"></p>
        </div>
        <div class="catalog__switchers" id="language"></div>
      </header>
      <ul class="catalog__tiles">
        <li>
          <a class="catalog__tile" href="./dice/">
            <svg class="catalog__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="3.5" width="17" height="17" rx="4" />
              <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none" />
              <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none" />
              <circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none" />
            </svg>
            <span class="catalog__name" data-i18n="widget.dice"></span>
            <span class="catalog__desc" data-i18n="widget.dice.desc"></span>
          </a>
        </li>
        <li>
          <a class="catalog__tile" href="./wheel/">
            <svg class="catalog__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="13.5" r="8" />
              <path d="M12 5.5v16M5.07 9.5l13.86 8M5.07 17.5l13.86-8" />
              <path d="M10 2.5h4L12 5z" fill="currentColor" />
            </svg>
            <span class="catalog__name" data-i18n="widget.wheel"></span>
            <span class="catalog__desc" data-i18n="widget.wheel.desc"></span>
          </a>
        </li>
        <li>
          <a class="catalog__tile" href="./timer/">
            <svg class="catalog__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="13.5" r="8" />
              <path d="M12 13.5V9.5M12 13.5l2.5 1.5M10 2.5h4M12 2.5v3M18.5 6.5l1.2-1.2" />
            </svg>
            <span class="catalog__name" data-i18n="widget.timer"></span>
            <span class="catalog__desc" data-i18n="widget.timer.desc"></span>
          </a>
        </li>
      </ul>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
