<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title"></title>
    <style>
      body {
        margin: 0 auto;
        max-width: 40rem;
        padding: 2rem 1rem;
        font-family: system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* Touch screens: finger-sized links and language switcher. */
      @media (pointer: coarse) {
        li a {
          display: inline-block;
          padding: 0.75rem 0;
        }
        select {
          min-height: 2.75rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-i18n="title"></h1>
      <div id="language"></div>
    </header>
    <ul>
      <li><a href="./dice/" data-i18n="widget.dice"></a></li>
      <li><a href="./wheel/" data-i18n="widget.wheel"></a></li>
      <li><a href="./timer/" data-i18n="widget.timer"></a></li>
    </ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
