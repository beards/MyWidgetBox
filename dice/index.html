<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script data-theme-boot>
      // Sets the theme before first paint; shared/theme.ts owns the list and the storage key.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('mywidgetbox:theme');
        } catch (error) {}
        document.documentElement.dataset.theme = ['soft', 'dark', 'paper'].indexOf(theme) >= 0 ? theme : 'soft';
      })();
    </script>
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/layout.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="dice__language layout__language" id="language" data-controls>
      <a class="layout__home" href="../" data-i18n="home"></a>
    </div>
    <main class="dice layout">
      <div class="layout__stage">
        <div class="dice__display layout__display" id="display">
          <button type="button" class="dice__stage" id="die" data-i18n-aria-label="roll"></button>
          <p class="dice__breakdown" id="breakdown" aria-live="polite"></p>
        </div>
        <div class="dice__actions" data-controls>
          <button type="button" class="dice__roll theme-primary" id="roll" data-i18n="roll"></button>
          <button type="button" id="reset" data-i18n="reset"></button>
        </div>
      </div>

      <section class="dice__controls layout__panel" data-controls>
        <button type="button" class="layout__panel-toggle" id="panel-toggle" aria-expanded="true" data-i18n-aria-label="panelToggle">
          <span class="layout__panel-toggle-icon" aria-hidden="true">›</span>
          <span class="layout__panel-toggle-label" data-i18n="panelToggle"></span>
        </button>
        <p class="dice__shared" id="shared-notice" hidden>
          <span data-i18n="sharedNotice"></span>
          <button type="button" id="shared-save" data-i18n="saveAsPreset"></button>
        </p>

        <h2 data-i18n="presets"></h2>
        <div class="dice__presets">
          <select id="preset" data-i18n-aria-label="presets"></select>
          <input type="text" id="preset-name" data-i18n-aria-label="presetName" />
          <button type="button" id="preset-new" data-i18n="newPreset"></button>
          <button type="button" id="preset-delete" data-i18n="deletePreset"></button>
        </div>
        <div class="dice__presets">
          <button type="button" id="settings-export" data-i18n="exportSettings"></button>
          <label><span data-i18n="importSettings"></span> <input type="file" id="settings-import" accept="application/json,.json" /></label>
          <button type="button" id="settings-restore" data-i18n="restoreDefaults"></button>
          <p id="settings-import-error" role="alert"></p>
        </div>

        <h2 data-i18n="diceSet"></h2>
        <ul class="dice__groups" id="groups"></ul>
        <div class="dice__add">
          <select id="add-sides"></select>
          <button type="button" id="add-die" data-i18n="addDie"></button>
        </div>
        <label class="dice__modifier">
          <span data-i18n="modifier"></span>
          <input type="number" id="modifier" step="1" value="0" />
        </label>
        <label class="dice__skip-animation">
          <input type="checkbox" id="skip-animation" />
          <span data-i18n="skipAnimation"></span>
        </label>
        <label class="dice__full-animation">
          <input type="checkbox" id="always-full" />
          <span data-i18n="alwaysFullAnimation"></span>
        </label>
        <label class="dice__shake">
          <input type="checkbox" id="shake-to-roll" />
          <span data-i18n="shakeToRoll"></span>
        </label>
        <p id="shake-status" role="status"></p>

        <h2 data-i18n="sound"></h2>
        <label class="dice__sound">
          <input type="checkbox" id="sound-enabled" />
          <span data-i18n="soundEnabled"></span>
        </label>
        <label class="dice__sound">
          <span data-i18n="soundVolume"></span>
          <input type="range" id="sound-volume" min="0" max="100" step="5" /> <output id="sound-volume-value" for="sound-volume"></output>
        </label>
        <label class="dice__sound">
          <span data-i18n="soundUrl"></span>
          <input type="url" id="sound-url" />
        </label>

        <div class="dice__appearance" id="appearance"></div>

        <h2 data-i18n="shareLink"></h2>
        <div class="dice__share">
          <label><input type="checkbox" id="share-display" /> <span data-i18n="shareDisplay"></span></label>
          <label><input type="checkbox" id="share-transparent" /> <span data-i18n="shareTransparent"></span></label>
          <div class="dice__share-copy">
            <button type="button" class="theme-primary" id="share-copy" data-i18n="copyShareLink"></button>
            <span id="share-status" role="status"></span>
          </div>
          <input type="text" id="share-url" readonly data-i18n-aria-label="shareLink" />
        </div>

        <h2 data-i18n="history"></h2>
        <ol class="dice__history" id="history"></ol>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
