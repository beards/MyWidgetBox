<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="../shared/layout.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="wheel__language layout__language" id="language" data-controls>
      <a class="layout__home" href="../" data-i18n="home"></a>
    </div>
    <main class="wheel layout">
      <div class="layout__stage">
        <div class="wheel__display layout__display" id="display">
          <button type="button" class="wheel__stage" id="wheel" data-i18n-aria-label="spin"></button>
          <button type="button" class="wheel__result" id="result" aria-live="polite" data-i18n-aria-label="dismissResult" hidden></button>
        </div>
        <p class="wheel__all-drawn" id="all-drawn" role="status" data-i18n="allDrawn" hidden></p>
        <div class="wheel__actions" data-controls>
          <button type="button" class="wheel__spin" id="spin" data-i18n="spin"></button>
          <button type="button" id="reset" data-i18n="reset"></button>
        </div>
      </div>

      <section class="wheel__controls layout__panel" data-controls>
        <p class="wheel__shared" id="shared-notice" hidden>
          <span data-i18n="sharedNotice"></span>
          <button type="button" id="shared-save" data-i18n="saveAsPreset"></button>
        </p>

        <h2 data-i18n="presets"></h2>
        <div class="wheel__row">
          <select id="preset" data-i18n-aria-label="presets"></select>
          <input type="text" id="preset-name" data-i18n-aria-label="presetName" />
          <button type="button" id="preset-new" data-i18n="newPreset"></button>
          <button type="button" id="preset-delete" data-i18n="deletePreset"></button>
        </div>
        <div class="wheel__row">
          <button type="button" id="settings-export" data-i18n="exportSettings"></button>
          <label><span data-i18n="importSettings"></span> <input type="file" id="settings-import" accept="application/json,.json" /></label>
          <button type="button" id="settings-restore" data-i18n="restoreDefaults"></button>
          <p id="settings-import-error" role="alert"></p>
        </div>

        <h2 data-i18n="entries"></h2>
        <ol class="wheel__entries" id="entries"></ol>
        <div class="wheel__row">
          <button type="button" id="add-entry" data-i18n="addEntry"></button>
        </div>
        <label class="wheel__row">
          <span data-i18n="animationDuration"></span>
          <input type="range" id="duration" min="1" max="10" step="0.5" />
          <output id="duration-value" for="duration"></output>
        </label>
        <label class="wheel__row">
          <input type="checkbox" id="always-full" />
          <span data-i18n="alwaysFullAnimation"></span>
        </label>
        <label class="wheel__row">
          <input type="checkbox" id="remove-after-draw" />
          <span data-i18n="removeAfterDraw"></span>
        </label>
        <label class="wheel__row">
          <input type="checkbox" id="result-auto-hide" />
          <span data-i18n="resultAutoHide"></span>
        </label>
        <label class="wheel__row" id="result-seconds-row">
          <span data-i18n="resultSeconds"></span>
          <input type="range" id="result-seconds" min="1" max="30" step="1" />
          <output id="result-seconds-value" for="result-seconds"></output>
        </label>

        <h2 data-i18n="sound"></h2>
        <label class="wheel__row">
          <input type="checkbox" id="sound-enabled" />
          <span data-i18n="soundEnabled"></span>
        </label>
        <label class="wheel__row">
          <span data-i18n="soundVolume"></span>
          <input type="range" id="sound-volume" min="0" max="100" step="5" />
        </label>
        <label class="wheel__row">
          <span data-i18n="soundUrl"></span>
          <input type="url" id="sound-url" />
        </label>

        <div class="wheel__appearance" id="appearance"></div>

        <h2 data-i18n="shareLink"></h2>
        <div class="wheel__share">
          <label><input type="checkbox" id="share-display" /> <span data-i18n="shareDisplay"></span></label>
          <label><input type="checkbox" id="share-transparent" /> <span data-i18n="shareTransparent"></span></label>
          <div class="wheel__row">
            <button type="button" id="share-copy" data-i18n="copyShareLink"></button>
            <span id="share-status" role="status"></span>
          </div>
          <input type="text" id="share-url" readonly data-i18n-aria-label="shareLink" />
        </div>

        <h2 data-i18n="history"></h2>
        <ol class="wheel__history" id="history"></ol>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
