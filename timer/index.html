<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script data-theme-boot>
      // Sets the theme before first paint; shared/theme.ts owns the list and the storage key.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('mywidgetbox:theme');
        } catch (error) {}
        document.documentElement.dataset.theme = ['soft', 'dark', 'paper'].indexOf(theme) >= 0 ? theme : 'soft';
      })();
    </script>
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/layout.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="timer__language layout__language" id="language" data-controls>
      <a class="layout__home" href="../" data-i18n="home"></a>
    </div>
    <main class="timer layout">
      <div class="layout__stage">
        <div class="timer__list" id="timers"></div>
        <button type="button" class="timer__add" id="timer-add" data-controls data-i18n="addTimer"></button>
      </div>

      <section class="timer__controls layout__panel" data-controls>
        <button type="button" class="layout__panel-toggle" id="panel-toggle" aria-expanded="true" data-i18n-aria-label="panelToggle">
          <span class="layout__panel-toggle-icon" aria-hidden="true">›</span>
          <span class="layout__panel-toggle-label" data-i18n="panelToggle"></span>
        </button>
        <p class="timer__shared" id="shared-notice" hidden>
          <span data-i18n="sharedNotice"></span>
          <button type="button" id="shared-save" data-i18n="saveAsPreset"></button>
        </p>

        <h2 data-i18n="presets"></h2>
        <div class="timer__row">
          <select id="preset" data-i18n-aria-label="presets"></select>
          <input type="text" id="preset-name" data-i18n-aria-label="presetName" />
          <button type="button" id="preset-new" data-i18n="newPreset"></button>
          <button type="button" id="preset-delete" data-i18n="deletePreset"></button>
        </div>
        <div class="timer__row">
          <button type="button" id="settings-export" data-i18n="exportSettings"></button>
          <label><span data-i18n="importSettings"></span> <input type="file" id="settings-import" accept="application/json,.json" /></label>
          <button type="button" id="settings-restore" data-i18n="restoreDefaults"></button>
          <p id="settings-import-error" role="alert"></p>
        </div>

        <h2 data-i18n="timers"></h2>
        <label><input type="checkbox" id="show-fraction" /> <span data-i18n="showFraction"></span></label>

        <h2 data-i18n="alert"></h2>
        <div class="timer__alert">
          <label><span data-i18n="alertSoundSeconds"></span> <input type="number" id="alert-sound-seconds" min="1" max="60" step="1" /></label>
          <label><span data-i18n="alertEffectSeconds"></span> <input type="number" id="alert-effect-seconds" min="0" max="3600" step="1" /></label>
          <label><input type="checkbox" id="sound-enabled" /> <span data-i18n="soundEnabled"></span></label>
          <label><span data-i18n="soundVolume"></span> <input type="range" id="sound-volume" min="0" max="100" step="5" /> <output id="sound-volume-value" for="sound-volume"></output></label>
          <label><span data-i18n="soundUrl"></span> <input type="url" id="sound-url" /></label>
        </div>

        <div class="timer__appearance" id="appearance"></div>

        <h2 data-i18n="shareLink"></h2>
        <div class="timer__share">
          <label><input type="checkbox" id="share-display" /> <span data-i18n="shareDisplay"></span></label>
          <label><input type="checkbox" id="share-transparent" /> <span data-i18n="shareTransparent"></span></label>
          <label><span data-i18n="shareTimer"></span> <select id="share-timer"></select></label>
          <div class="timer__row">
            <button type="button" class="theme-primary" id="share-copy" data-i18n="copyShareLink"></button>
            <span id="share-status" role="status"></span>
          </div>
          <input type="text" id="share-url" readonly data-i18n-aria-label="shareLink" />
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
